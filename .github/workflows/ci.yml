name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sa/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm assets:optimize
      - run: pnpm test
      - run: pnpm --filter @sa/miniapp build
      - run: pnpm assets:check
